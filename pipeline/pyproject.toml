[project]
name = "boston-pipeline"
version = "0.1.0"
description = "Builds walkable 3D Tiles of Boston from open geodata"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "shapely>=2.0",
    "pyproj>=3.6",
    "mapbox-earcut>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow"]
audit = ["pillow"]

[project.scripts]
boston-pipeline = "boston_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["boston_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
