# Builds the pilot district and publishes the viewer to GitHub Pages.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Publish viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e ./pipeline

      # Reuse the downloaded map data between runs to go easy on the Overpass
      # API. Run the workflow manually with a cleared cache to refresh it.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: osm-${{ hashFiles('areas.toml', 'pipeline/boston_pipeline/osm.py', 'pipeline/boston_pipeline/inventory.py') }}
      - run: boston-pipeline fetch pilot
      - run: boston-pipeline build pilot

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # Notes left in the viewer are filed as issues in this repository.
          VITE_REPO: ${{ github.repository }}
          VITE_COMMIT: ${{ github.sha }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
