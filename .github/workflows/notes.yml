# Labels tickets that were filed from the viewer, so they can be listed with
# `gh issue list --label note`. A viewer note carries a JSON block containing
# "boston_note"; nothing from the issue text is ever run as a command.
name: Label viewer notes

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    if: contains(github.event.issue.body, '"boston_note"')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
    steps:
      - run: >
          gh label create note --repo "$GITHUB_REPOSITORY" --color F2A93B
          --description "Left from the viewer, with the exact position" --force
      - run: gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label note
