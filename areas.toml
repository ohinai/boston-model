# Named areas the pipeline can build. bbox is WGS84 [west, south, east, north];
# the build rounds it outward to whole tiles. Places become teleport targets in
# the viewer.

[pilot]
name = "Downtown pilot"
description = "Boston Common, Beacon Hill, Downtown Crossing, Government Center, the Financial District and the waterfront"
bbox = [-71.0760, 42.3500, -71.0480, 42.3640]

# The City of Boston's building survey gives heights to buildings that have none (pipeline/boston_pipeline/cityheights.py, docs/DATA_SOURCES.md).
# Delete this line to turn it off. The pilot lists it too, so that its tiles stay identical to the same tiles of `boston`.
extra_sources = ["city_heights"]

[[pilot.places]]
name = "Massachusetts State House"
lat = 42.35745
lon = -71.06368
heading = 0

[[pilot.places]]
name = "Boston Common (Brewer Fountain)"
lat = 42.35606
lon = -71.06262
heading = 240

[[pilot.places]]
name = "Public Garden"
lat = 42.35405
lon = -71.07010
heading = 300

[[pilot.places]]
name = "Downtown Crossing"
lat = 42.35550
lon = -71.06045
heading = 40

[[pilot.places]]
name = "Old State House"
lat = 42.35868
lon = -71.05790
heading = 270

[[pilot.places]]
name = "Faneuil Hall"
lat = 42.36000
lon = -71.05690
heading = 90

[[pilot.places]]
name = "Long Wharf"
lat = 42.36042
lon = -71.05080
heading = 90

[[pilot.places]]
name = "Acorn Street, Beacon Hill"
lat = 42.35762
lon = -71.06905
heading = 250

[boston]
name = "Boston core and North Brookline"
description = "The pilot district, plus Back Bay, Kenmore, Fenway, the Longwood edge and North Brookline out to Coolidge Corner, Washington Square and the Brookline Reservoir"
# Built as one rectangle so the sea and water edges close the same way as in the pilot. The pilot's own tiles come out
# identical; fetch downloads the map in strips (see osm.fetch_area).
bbox = [-71.1470, 42.3315, -71.0480, 42.3640]
# Optional data beyond OpenStreetMap and the city's tree inventory. "brookline" adds the Town of Brookline's tree inventory
# and building heights (pipeline/boston_pipeline/brookline.py), "city_heights" the City of Boston's surveyed building heights
# (cityheights.py); see docs/DATA_SOURCES.md. Delete a word to turn that source off.
extra_sources = ["brookline", "city_heights"]

