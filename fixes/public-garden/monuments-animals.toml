# Animal statues. The pipeline draws `animal=*` as a low animal (body, neck and head) standing on the ground,
# sized by `length` where there is one, instead of a person on a pedestal. `support=ground` is the standard
# OpenStreetMap tag for a statue with no pedestal (already on Myrtle the Turtle, n7831030800).
# Sizes are not in the data, so these are drawn at a default 0.9 m nose to tail. The nine ducks are mapped in a line,
# Mrs. Mallard at its south-western end with the ducklings following behind, so they face south-west (225).

# Make Way for Ducklings: Mrs. Mallard and her eight ducklings, named in the data after the book's characters.
["n2446221110"]
why = "Mrs. Mallard, from the Make Way for Ducklings group named by the project owner: a duck, standing on the ground along the path, not a person on a pedestal. Faces south-west, the way the line of nine mapped points runs toward Mrs. Mallard at its south-western end."
at = [42.35550, -71.06977]
set = { animal = "duck", support = "ground", direction = "225" }

