# Animal statues. The pipeline draws `animal=*` as a low animal standing on the ground, sized by `length` (nose to
# tail) where there is one, instead of a person on a pedestal: a duck, goose or swan as a bird, a dog or lion as a
# four-legged animal, a turtle with its shell (monuments.py); any other animal as a simple low one.
# `support=ground` is the standard OpenStreetMap tag for a statue with no pedestal (already on Myrtle the Turtle,
# n7831030800).
#
# The nine ducks are mapped in a curving line, Mrs. Mallard at its south-western end with the ducklings following
# behind her, 0.6 to 0.95 m apart. Each faces the one ahead of it along that line (the bearing from its own point to
# the previous point, computed from the OpenStreetMap coordinates), so they walk in file toward the south-west.
# The sizes are not in the data. 0.9 m for the mother and 0.42 m for each duckling are plausible sizes for a bronze
# duck group, chosen so that the nine fit the spacing of their points without overlapping: they are NOT measured
# (see "needs data" in the lane report).

# Make Way for Ducklings: Mrs. Mallard and her eight ducklings, named in the data after the book's characters.
["n2446221110"]
why = "Mrs. Mallard, from the Make Way for Ducklings group named by the project owner: a duck, standing on the ground along the path, not a person on a pedestal. She leads the line, so she faces the way it runs, south-west (239 degrees). Drawn 0.9 m from bill to tail: a plausible size, not measured."
at = [42.35550, -71.06977]
set = { animal = "duck", support = "ground", direction = "239", length = "0.9" }

