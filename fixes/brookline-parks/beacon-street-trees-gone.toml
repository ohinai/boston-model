# Coolidge Corner: Town of Brookline inventory trees that stand in empty tree pits.
#
# Two rows of records along Beacon Street just west of Coolidge Corner, from about 42.3432,-71.1228
# to 42.3424,-71.1214 (ids brk:10397 to 10418, 10587 to 10590, 10644), have trunk sizes of 26 to 38 cm
# and so are drawn as 6 to 9 m crowns 10 to 12 m high. The photographs show none of them. Found by the
# aerial audit (.claude/commands/audit.md: no crown under a modelled tree with a trunk of 25 cm or more),
# then checked one by one in three independent surveys: USGS NAIP 7 July 2023 (leaf-on), and MassGIS 15 cm
# leaf-off spring 2023 and spring 2025 (credit MassGIS). A tree planted after spring 2025 would not show,
# but it would not have the record's trunk size either.
#
# Checked and kept, so nobody removes them by mistake: brk:13940 (red maple, 8 cm trunk, a young tree on the
# same block), brk:1018314 to 1018317 and 1018335 (young 'Armstrong' maples and 'Homestead' elm, 15 cm trunk,
# records added in the 2020s, which the 2023 summer photograph may predate), brk:368 (linden, a crown stands
# beside its pit), brk:569 (sycamore, a bare tree with fine branches stands in the 2023 leaf-off photograph).

["brk:10397"]
why = "Town of Brookline inventory record for a Red maple 'Karpick' (trunk 28 cm) that is no longer there. The tree pit at this point is bare in the USGS NAIP photograph of 7 July 2023 (leaf-on: no crown, only a little pit weed) and in the MassGIS 15 cm leaf-off photographs of spring 2023 and spring 2025 (no trunk, no branches, no branch shadow). A tree with the record's trunk size would show in all three. The neighbouring records of this block are in the same state."
at = [42.343181, -71.122750]
