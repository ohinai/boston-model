# The rebuilt Michael Driscoll School (Washington Street, Washington Square): Town of Brookline inventory
# trees of the old school grounds that the new building, yard and sidewalk have replaced.
#
# Found by the aerial audit (.claude/commands/audit.md: no crown under a modelled tree with a trunk of 25 cm
# or more) and by listing trees whose trunk stands inside a building footprint (11 stand inside the
# school's outline). Each checked in three independent surveys: USGS NAIP 7 July 2023 (leaf-on), and MassGIS
# 15 cm leaf-off spring 2023 and spring 2025 (credit MassGIS). The ids 17068 to 17107 are one run of records.
#
# Left alone: the young records of the same run (brk:17069, 17070, 17073, 17074, 17076, trunks of 5 to 8 cm)
# and brk:3451, 3453 (10 to 15 cm), which could be new plantings too small to see; brk:13603 (Norway maple, a
# dark crown or bare branches stand at its point in the 2025 photograph); brk:3954 and brk:9937, across the street.

["brk:3454"]
why = "Town of Brookline inventory record for a Norway maple (trunk 31 cm) that is no longer there. The Michael Driscoll School has been rebuilt on this site. The point now lies on the new building's roof, or on the cleared yard, car park or sidewalk beside it: the USGS NAIP photograph of 7 July 2023 (leaf-on) shows the new roof and a cleared, partly built site with no tree crown here, and the MassGIS 15 cm leaf-off photographs of spring 2023 and spring 2025 show no trunk, branch or branch shadow at the point. The neighbouring records of this block are in the same state."
at = [42.340543, -71.135421]
delete = true

