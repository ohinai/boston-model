["n7599402961"]
why = """The Citgo sign over Kenmore Square. OpenStreetMap gives its position, its height (43 m to the top) and the two ways it faces (245 and 65 degrees). Its width is measured on the USGS NAIP photograph of 7 July 2023: the frame is 17 to 18 m long on the roof of 660 Beacon Street (w29559484, 21.4 m), and the board is as tall as it is wide, so `size` says 18 by 18 m. `sign:face=triangle` draws a plain red triangle over a blue band on a pale board. No lettering is drawn: the pipeline never draws a brand's lettering."""
set = { "size" = "18*18", "sign:face" = "triangle" }
