["n7721699111"]
why = "Phillis Wheatley of the Boston Women's Memorial is a life-size seated bronze (at a writing desk) on the memorial's paving, not a 3.4 m figure on a pedestal. A seated figure is about 1.4 m high."
at = [42.35052, -71.08337]
set = { support = "ground", height = "1.4" }
