# Charles River Esplanade: crown widths of trees whose mapped point is right but whose drawn crown is far too big.
# Source: USGS NAIP aerial imagery of 7 July 2023 (leaf-on), enlarged and measured by eye against the 0.12 m pixels; each of these
# stands alone, beside the Storrow Drive carriageway, so its crown can be told from its neighbours. The model draws 8.6 to 11.3 m by default.

["n7757237567"]
why = "A single tree seen in the USGS NAIP photograph of 7 July 2023 (audit cell c_-13_-5): a small crown about 3.5 m across at the road edge, 2 to 3 m off the mapped point; the default drawn crown is 8.59 m. The point is kept; only the crown width is set."
at = [42.353824, -71.081769]
set = { diameter_crown = "3.5" }

